# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - cmcApiKey
    properties:
      cmcApiKey:
        type: string
        description: API key for CoinMarketCap
    description: Configuration for mcp-server-web3
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { CMC_API_KEY: config.cmcApiKey } })
  exampleConfig:
    cmcApiKey: dummy-api-key-1234
